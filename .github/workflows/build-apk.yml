name: Build Hisab APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Accounting engine tests
        run: gradle :core:test --stacktrace
      - name: Write local config (public client values only)
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
